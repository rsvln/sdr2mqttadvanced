name: Build sdr2mqttadvanced image

# Builds the add-on image for each arch and pushes it to ghcr.io, so Home Assistant
# only pulls a ready image (config.json "image") instead of compiling on the host.

on:
  push:
    branches: [main]
    paths:
      - "sdr2mqtt/**"
      - ".github/workflows/build-sdr2mqtt.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64, armv7]
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: cfg
        run: echo "version=$(jq -r .version sdr2mqtt/config.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: sdr2mqtt
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.cfg.outputs.version }}
          labels: |
            io.hass.version=${{ steps.cfg.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=app
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-sdr2mqttadvanced:${{ steps.cfg.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-sdr2mqttadvanced:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
